# Builds the game for WebGL in the cloud and publishes it to GitHub Pages.
# Needs repo secrets UNITY_EMAIL and UNITY_PASSWORD (a Unity ID login, 2FA off).
name: Build WebGL & deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned so the ubuntu-latest move to 26 can't break builds
    steps:
      # The Unity image plus a WebGL build need more room than a fresh runner has.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false # keep swap as a memory safety net for Unity

      - uses: actions/checkout@v7

      # Cached Library (Unity's imported project), exact matches only: restoring a Library
      # from a different version of the project got Unity killed on startup (exit 137).
      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Build WebGL
        id: build
        continue-on-error: true
        uses: game-ci/unity-builder@v6
        env:
          # Activates with the Unity account. The .ulf licence file is machine-bound and
          # can't be used on GitHub's runners, so it's not passed.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: HauntedHouse
          buildsPath: build
          versioning: None

      # Safety net: if the cached Library made the build fail, throw it away and
      # rebuild from a clean import in the same run.
      - name: Clear cached Library after failure
        if: steps.build.outcome == 'failure'
        run: |
          sudo rm -rf Library build
          sudo git checkout -- .
          sudo git clean -fdq

      - name: Build WebGL (clean retry)
        if: steps.build.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: HauntedHouse
          buildsPath: build
          versioning: None

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/WebGL/HauntedHouse

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
